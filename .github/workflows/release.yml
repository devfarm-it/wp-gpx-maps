# Publishes a new version to wordpress.org when a version tag is pushed:
#   git tag 1.8.01 && git push origin 1.8.01
# Needs the repository secrets SVN_USERNAME and SVN_PASSWORD (wordpress.org SVN password).
name: Release to wordpress.org

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Optional manual approval: add required reviewers to this environment in Settings > Environments
    environment: wordpress-org
    steps:
      - uses: actions/checkout@v4

      - name: Tag, plugin Version and readme Stable tag must match
        run: |
          TAG="${GITHUB_REF_NAME}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' wp-gpx-maps.php | sed -E 's/.*Version:\s*//' | tr -d '\r ')
          CONST=$(grep -m1 "WPGPXMAPS_CURRENT_VERSION'" wp-gpx-maps.php | sed -E "s/.*, *'([^']+)'.*/\1/")
          STABLE=$(grep -m1 -E '^Stable tag:' readme.txt | sed -E 's/Stable tag:\s*//' | tr -d '\r ')
          echo "tag=$TAG header=$HEADER constant=$CONST stable=$STABLE"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ] || [ "$TAG" != "$STABLE" ]; then
            echo "::error::Version mismatch: update 'Version:' and WPGPXMAPS_CURRENT_VERSION in wp-gpx-maps.php and 'Stable tag:' in readme.txt to $TAG"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Deploy to wordpress.org SVN (trunk + tags/version + assets)
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: wp-gpx-maps

      - name: GitHub release with the plugin zip
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
          generate_release_notes: true
